name: SimpleHammers
version: '${project.version}'
main: dev.simplehammers.SimpleHammers
api-version: '1.21'
description: Hammers that mine a 3x3x1 area. Java Edition port of the Bedrock add-on Simple Hammers.
author: Port of "Simple Hammers" by Salas
commands:
  hammer:
    description: Give hammers or reload the config
    usage: /hammer <give|reload>
    permission: simplehammers.admin
permissions:
  simplehammers.admin:
    description: Use /hammer
    default: op
  simplehammers.use:
    description: Mine with hammers in 3x3
    default: true
